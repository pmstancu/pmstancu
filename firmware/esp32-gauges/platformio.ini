; Firmware ESP32-S3: achiziție senzori + afișaj GC9A01 + flux de date USB către CM5.
; Build:   pio run -e esp32s3
; Upload:  pio run -e esp32s3 -t upload
; Teste:   pio test -e native      (testează doar conversiile, fără hardware)

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*>
build_flags =
    ; USB nativ al ESP32-S3 ca port serial (apare ca /dev/ttyACM0 pe CM5)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- Configurare TFT_eSPI pentru GC9A01 (fără a edita User_Setup.h din bibliotecă) ---
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_SCLK=4
    -DTFT_MOSI=5
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=17
    -DTFT_BL=18
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    ; Pe ESP32-S3, TFT_eSPI cu portul implicit poate da crash; HSPI e varianta folosită uzual.
    -DUSE_HSPI_PORT=1
lib_deps =
    adafruit/Adafruit MAX31865 library
    adafruit/Adafruit MAX31856 library
    adafruit/Adafruit ADS1X15
    bodmer/TFT_eSPI

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -Iinclude
