; LC100 Gauge: ESP32-S3, 3 × GC9A01, senzori, log microSD, setări prin Wi-Fi.
; Build:   pio run -e esp32s3
; Upload:  pio run -e esp32s3 -t upload
; Teste:   pio test -e native      (logica pură, fără hardware)
;
; Versiunile bibliotecilor de mai jos sunt cele ale căror surse au fost
; folosite la scrierea codului. Versiunea platformei nu a putut fi testată
; (vezi docs/07-de-verificat.md).

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Codul merge și fără PSRAM (buffer-ul display-ului de ~113 KB încape în RAM).
; Pentru o placă N16R8 poți activa PSRAM-ul cu cele două linii de mai jos
; (decomentează-le) [VERIFICĂ] că placa ta are PSRAM octal:
; board_build.arduino.memory_type = qio_opi
; build_flags = ... -DBOARD_HAS_PSRAM
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI pentru GC9A01, fără a edita User_Setup.h din bibliotecă ---
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_SCLK=4
    -DTFT_MOSI=5
    ; CS = -1: cele trei CS-uri sunt comandate din cod (vezi pins.h)
    -DTFT_CS=-1
    -DTFT_DC=7
    -DTFT_RST=17
    ; Lumina de fundal (BL/BLK) a celor trei module se leagă direct la 3.3 V.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=40000000
    ; Display-urile pe HSPI; SPI-ul implicit (FSPI) rămâne pentru cardul SD.
    -DUSE_HSPI_PORT=1
lib_deps =
    adafruit/Adafruit MAX31865 library@^1.6.2
    adafruit/Adafruit MAX31856 library@^1.2.8
    adafruit/Adafruit ADS1X15@^2.6.2
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.4.2

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -Iinclude
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
