; Test pentru cele 3 display-uri GC9A01, pe aceiași pini ca firmware-ul principal.
; Folosește codul de display din ../lc100-gauge (nu e o copie).
;
;   pio run -e test40 -t upload && pio device monitor     (SPI 40 MHz)
;   pio run -e test27 -t upload && pio device monitor     (SPI 27 MHz)
;   pio run -e test20 -t upload && pio device monitor     (SPI 20 MHz)
;
; Vezi docs/08-test-display.md.

[platformio]
default_envs = test40

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -I../lc100-gauge/include
    -I../lc100-gauge/src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- aceleași setări TFT_eSPI ca în ../lc100-gauge/platformio.ini ---
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_SCLK=4
    -DTFT_MOSI=5
    -DTFT_CS=-1
    -DTFT_DC=7
    -DTFT_RST=17
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DUSE_HSPI_PORT=1
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.4.2

[env:test40]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DSPI_FREQUENCY=40000000

[env:test27]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DSPI_FREQUENCY=27000000

[env:test20]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DSPI_FREQUENCY=20000000
