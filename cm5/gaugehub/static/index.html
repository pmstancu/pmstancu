<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LC100 Gauges</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <span class="title">Land Cruiser 100 · 1HD-FTE</span>
    <span id="link" class="link" role="status">conectare…</span>
  </header>

  <main class="grid">
    <section class="tile hero" data-ch="egt" aria-label="EGT pre-turbo">
      <div class="label">EGT pre-turbo</div>
      <svg class="arc" viewBox="0 0 200 168" aria-hidden="true">
        <path class="arc-track" d="M 50.5 139.5 A 70 70 0 1 1 149.5 139.5" pathLength="100"/>
        <path class="arc-fill" d="M 50.5 139.5 A 70 70 0 1 1 149.5 139.5" pathLength="100"/>
        <line class="arc-tick warn"/>
        <line class="arc-tick crit"/>
      </svg>
      <div class="value"><span class="num">---</span><span class="unit">°C</span></div>
      <div class="status" hidden></div>
      <div class="trend">
        <canvas width="600" height="90" aria-label="EGT ultimele 60 s"></canvas>
        <div class="trend-caption">ultimele 60 s</div>
      </div>
    </section>

    <section class="tile" data-ch="boost"><div class="label">Boost</div>
      <div class="value"><span class="num">---</span><span class="unit">psi</span></div>
      <div class="meter"><div class="meter-fill"></div><i class="tick warn"></i><i class="tick crit"></i></div>
      <div class="status" hidden></div></section>

    <section class="tile" data-ch="afr"><div class="label">Lambda <span class="sub">AFR <b class="afr">---</b></span></div>
      <div class="value"><span class="num">---</span><span class="unit">λ</span></div>
      <div class="meter"><div class="meter-fill"></div></div>
      <div class="status" hidden></div></section>

    <section class="tile" data-ch="ect"><div class="label">Apă</div>
      <div class="value"><span class="num">---</span><span class="unit">°C</span></div>
      <div class="meter"><div class="meter-fill"></div><i class="tick warn"></i><i class="tick crit"></i></div>
      <div class="status" hidden></div></section>

    <section class="tile" data-ch="eot"><div class="label">Ulei</div>
      <div class="value"><span class="num">---</span><span class="unit">°C</span></div>
      <div class="meter"><div class="meter-fill"></div><i class="tick warn"></i><i class="tick crit"></i></div>
      <div class="status" hidden></div></section>

    <section class="tile" data-ch="iat"><div class="label">Aer intercooler</div>
      <div class="value"><span class="num">---</span><span class="unit">°C</span></div>
      <div class="meter"><div class="meter-fill"></div><i class="tick warn"></i><i class="tick crit"></i></div>
      <div class="status" hidden></div></section>

    <section class="tile" data-ch="vbat"><div class="label">Baterie</div>
      <div class="value"><span class="num">---</span><span class="unit">V</span></div>
      <div class="meter"><div class="meter-fill"></div></div>
      <div class="status" hidden></div></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
